name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything in `make check` except the Go tests, which run split over the go-test matrix.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install code generators and linter
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/gzuidhof/tygo@v0.2.21
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: make check (without the Go tests)
        run: make check
        env:
          CHECK_SKIP: test-go

  # The race-detector Go tests, split over the parts of the matrix (GOTEST_SPLIT, see
  # scripts/gotest.sh). Each part fails unless it ran exactly the tests assigned to it; go-test-union
  # checks that the parts together ran every listed test. The generated code is committed (the check
  # job fails on drift) and the build embeds only internal/webui/dist/.gitkeep, so the tests need
  # neither the generators nor the web build. To change the number of parts, edit the part list.
  go-test:
    name: go-test (${{ matrix.part }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The setup-go cache holds the non-race build the other jobs save; the race build has its own.
          cache: false
      # Each part first builds every race test binary (about 2-3 minutes cold). The compiled
      # packages of the last main push make that a relink of what changed. Tests always run
      # (-count=1), so the cache only saves compiling.
      - name: Restore the race build cache
        id: race-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-race-${{ runner.os }}-
      - name: make test-go
        run: make test-go RACE=1 GOTEST_SPLIT=${{ matrix.part }}/${{ strategy.job-total }}
        env:
          # Every part must split with the same SHARDS; pinned so a runner's CPU count cannot change it.
          SHARDS: "4"
          # The race detector on a 4-core runner is slow; local runs keep the 20-minute default, so a
          # hung test still fails fast there.
          TIMEOUT: "40m"
          GOTEST_REPORT: ${{ runner.temp }}/gotest-report
      # Every part builds the same binaries, so one part saves them, and only on main, whose caches
      # every branch can read. Go trims entries unused for five days, which keeps the cache bounded.
      - name: Save the race build cache
        if: always() && matrix.part == 1 && github.event_name == 'push' && steps.race-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true # a cache that cannot be saved never fails the tests
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.race-cache.outputs.cache-primary-key }}
      - name: Upload the split report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gotest-report-${{ matrix.part }}
          path: ${{ runner.temp }}/gotest-report/
          if-no-files-found: error
          retention-days: 7

  # One status for the whole matrix: every part passed and together they ran every listed test once.
  go-test-union:
    name: go-test
    needs: go-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gotest-report-*
          path: reports
      - name: Check that the parts ran every test exactly once
        run: |
          status=0
          if [ "${{ needs.go-test.result }}" != success ]; then
            echo "::error title=go test::a go-test part did not pass (${{ needs.go-test.result }}); see its log"
            status=1
          fi
          scripts/gotest-union.sh reports/* || status=1
          exit "$status"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install web dependencies
        run: make web-install
      - name: Install Playwright Chromium
        working-directory: web
        # The system packages come from the Ubuntu mirrors, which the runners sometimes cannot reach
        # for an hour or more. The runner image already has the libraries Chrome needs, so without
        # the mirrors install Chromium alone instead of failing the job.
        run: |
          if timeout 20 getent hosts archive.ubuntu.com >/dev/null &&
            timeout 600 bunx playwright install --with-deps chromium; then
            exit 0
          fi
          echo "::warning::Ubuntu mirrors unreachable; installing Chromium without system packages"
          bunx playwright install chromium
      - name: make e2e
        run: make e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for git describe
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
